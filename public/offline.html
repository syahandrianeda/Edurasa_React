<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>Edurasa - Offline</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #ffffff;
        color: #09090b;
      }

      body {
        min-height: 100vh;
      }

      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 9999px;
        background: #f4f4f5;
      }

      .icon svg {
        width: 40px;
        height: 40px;
        stroke: #71717a;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        margin: 0 0 12px;

        font-size: 24px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      p {
        margin: 0 auto 24px;

        max-width: 380px;

        color: #71717a;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        height: 40px;
        padding: 0 16px;

        border: 0;
        border-radius: 6px;

        background: #18181b;
        color: #fafafa;

        font-size: 14px;
        font-weight: 500;

        cursor: pointer;
      }

      button:hover {
        background: #27272a;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="content">
        <div class="icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M1 1l22 22" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 11.72-1.49" />
            <path d="M8.53 16.11a6 6 0 0 1 6.94 0" />
            <path d="M12 20h.01" />
          </svg>
        </div>

        <h1>Anda sedang offline</h1>

        <p>
          Halaman yang Anda buka belum tersedia secara offline.
          Silakan sambungkan kembali perangkat ke internet untuk
          membuka halaman ini.
        </p>

        <button
          type="button"
          onclick="window.location.reload()"
        >
          Coba lagi
        </button>
      </div>
    </main>
  </body>
</html>
